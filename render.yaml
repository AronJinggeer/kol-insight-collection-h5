services:
  - type: web
    name: kol-insight-collection-h5
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: data
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kol-insight-collection-h5-db
          property: connectionString
      - key: SURVEY_REQUIRE_DATABASE
        value: "true"

databases:
  - name: kol-insight-collection-h5-db
    plan: basic-256mb
    databaseName: kol_insight_collection_h5
    user: kol_insight_collection_h5
