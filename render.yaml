services:
  - type: web
    name: kol-insight-collection-h5
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: data
      - key: ADMIN_PASSWORD
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_USER_ACCESS_TOKEN
        sync: false
      - key: FEISHU_USER_REFRESH_TOKEN
        sync: false
      - key: FEISHU_BITABLE_APP_TOKEN
        sync: false
      - key: FEISHU_BITABLE_TABLE_ID
        sync: false
      - key: SURVEY_REQUIRE_PERSISTENT_STORAGE
        value: "true"
